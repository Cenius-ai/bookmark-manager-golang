<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} — Bookmark Manager</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/fonts/fonts.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <svg class="brand-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
          <path d="M12 6v9"/>
          <path d="M8 10.5h8"/>
        </svg>
        <span>Bookmarks</span>
      </div>
      <nav class="sidebar-nav">
        <a href="/" class="nav-item{{if not .TagFilter}} active{{end}}">All Bookmarks</a>
        <a href="/add" class="nav-item nav-add">+ Add New</a>
      </nav>
      <div class="sidebar-tags">
        <h3 class="tags-heading">Tags</h3>
        <div class="tag-cloud">
          {{range .AllTags}}
          <a href="/?tag={{.Name}}" class="tag-pill{{if eq $.TagFilter .Name}} active{{end}}">{{.Name}}</a>
          {{end}}
        </div>
        {{if .TagFilter}}
        <a href="/" class="clear-filter">× clear filter</a>
        {{end}}
      </div>
    </aside>
    <main class="content">
      {{embed}}
    </main>
  </div>
</body>
</html>
