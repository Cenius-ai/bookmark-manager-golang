<div class="page-header">
  <h2 class="page-title">Add Bookmark</h2>
</div>

{{if .Error}}
<div class="form-error">{{.Error}}</div>
{{end}}

<form action="/bookmarks" method="post" class="bookmark-form">
  <div class="form-group">
    <label for="url" class="form-label">URL</label>
    <input
      type="text"
      id="url"
      name="url"
      class="form-input"
      placeholder="https://example.com"
      value="{{.FormURL}}"
      required
      autofocus
    >
  </div>

  <div class="form-group">
    <label for="title" class="form-label">Title</label>
    <input
      type="text"
      id="title"
      name="title"
      class="form-input"
      placeholder="Page title"
      value="{{.FormTitle}}"
      required
    >
  </div>

  <div class="form-group">
    <label for="tags" class="form-label">Tags</label>
    <input
      type="text"
      id="tags"
      name="tags"
      class="form-input"
      placeholder="e.g. golang,web,reference"
      value="{{.FormTags}}"
    >
    <p class="form-help">Separate tags with commas.</p>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Save Bookmark</button>
    <a href="/" class="btn btn-ghost">Cancel</a>
  </div>
</form>
